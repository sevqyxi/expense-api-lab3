info:
  name: Create record with invalid user_id - 400
  type: http
  seq: 16
http:
  method: POST
  url: '{{baseUrl}}/record'
  body:
    type: json
    data: |-
      {
        "user_id": "abc",
        "category_id": {{globalCategoryId}},
        "amount": 100
      }
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '400'
