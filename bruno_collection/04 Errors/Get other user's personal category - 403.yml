info:
  name: Get other user's personal category - 403
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/category/{{otherCategoryId}}?user_id={{userId}}'
  params:
  - name: user_id
    value: '{{userId}}'
    type: query
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '403'
