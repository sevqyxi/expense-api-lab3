info:
  name: Create record with unknown category - 404
  type: http
  seq: 13
http:
  method: POST
  url: '{{baseUrl}}/record'
  body:
    type: json
    data: |-
      {
        "user_id": {{userId}},
        "category_id": 9999,
        "amount": 100
      }
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '404'
