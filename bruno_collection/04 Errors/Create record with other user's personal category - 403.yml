info:
  name: Create record with other user's personal category - 403
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/record'
  body:
    type: json
    data: |-
      {
        "user_id": {{userId}},
        "category_id": {{otherCategoryId}},
        "amount": 100
      }
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '403'
