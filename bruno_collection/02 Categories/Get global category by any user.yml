info:
  name: Get global category by any user
  type: http
  seq: 7
http:
  method: GET
  url: '{{baseUrl}}/category/{{globalCategoryId}}?user_id={{otherUserId}}'
  params:
  - name: user_id
    value: '{{otherUserId}}'
    type: query
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
